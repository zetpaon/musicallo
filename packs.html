<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Паки — musicallo</title>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --bg:#0a0a0f; --card:#151522; --border:#2a2a3e; --accent:#a29bfe; --text:#e0e0e0; --dim:#8888aa; }
        * { box-sizing:border-box; } body { margin:0; padding:20px; min-height:100vh; color:var(--text); font:16px 'Segoe UI',Inter,sans-serif; background:var(--bg); }
        .page { min-height:calc(100vh - 40px); display:flex; flex-direction:column; } .header, main, footer { width:100%; max-width:960px; margin-inline:auto; }
        .header { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border:1px solid rgba(255,255,255,.08); border-radius:16px; background:rgba(21,21,34,.72); }
        .brand { color:var(--text); font-size:1.35rem; font-weight:700; text-decoration:none; } .back, button { border:1px solid rgba(108,92,231,.4); border-radius:10px; padding:8px 12px; color:var(--accent); background:rgba(108,92,231,.12); font:inherit; font-weight:600; cursor:pointer; text-decoration:none; }
        main { flex:1; padding:28px 0; } .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; } select { padding:8px; border:1px solid var(--border); border-radius:8px; color:var(--text); background:var(--card); }
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; } .pack { min-height:165px; padding:18px; border:1px solid var(--border); border-radius:16px; background:var(--card); cursor:pointer; transition:transform .3s ease, border-color .3s ease; } .pack:hover { transform:translateY(-3px); border-color:var(--accent); }
        .icon { font-size:2rem; } .pack h2 { margin:10px 0 6px; font-size:1.1rem; } .pack p,.meta,.status { color:var(--dim); font-size:.9rem; } .pagination { display:flex; justify-content:center; align-items:center; gap:16px; margin-top:24px; } .pagination button:disabled { opacity:.4; cursor:default; } .page-number { min-width:40px; padding:8px 12px; border:1px solid var(--border); border-radius:10px; background:var(--card); color:var(--text); font-weight:700; text-align:center; }
        dialog { width:min(560px,calc(100% - 32px)); padding:24px; border:1px solid var(--border); border-radius:16px; color:var(--text); background:var(--card); } dialog::backdrop { background:rgba(0,0,0,.7); } dialog h2 { margin-top:0; } .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; } .form { display:grid; gap:10px; } input,textarea { width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; color:var(--text); background:#0a0a0f; font:inherit; } textarea { min-height:72px; resize:vertical; } .color-input { height:44px; padding:4px; cursor:pointer; } .tracks,.suggestions,.pack-ranking { display:grid; gap:8px; } .track { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:9px; border-radius:8px; background:rgba(255,255,255,.04); font-size:.85rem; } .remove { padding:3px 7px; color:#ff8f8f; border-color:rgba(255,107,107,.4); background:transparent; } .suggestion { text-align:left; animation:suggestionIn .3s ease-out both; } @keyframes suggestionIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } } .ranking-title { margin:18px 0 8px; font-size:1rem; } footer { padding-top:14px; border-top:1px solid rgba(255,255,255,.08); color:var(--dim); font-size:.72rem; text-align:center; }
        @media (max-width:640px) { body { padding:12px; } .page { min-height:calc(100vh - 24px); } .toolbar { align-items:flex-start; flex-direction:column; } }
    </style>
</head>
<body>
<div class="page">
    <header class="header"><a class="brand" href="index.html">musicallo</a><a class="back" href="index.html">← Играть</a></header>
    <main>
        <div class="toolbar"><div><h1>Паки</h1><div class="meta">Наборы музыки от сообщества</div></div><div><select id="sort"><option value="new">Сначала новые</option><option value="plays">По прохождениям</option></select> <button id="create">Создать пак</button></div></div>
        <div class="grid" id="packs"><div class="status">Загрузка паков...</div></div><div class="pagination"><button id="previous">←</button><span class="page-number" id="page">1</span><button id="next">→</button></div>
    </main>
    <footer>zetpaon</footer>
</div>
<dialog id="detail"><h2 id="detailName"></h2><p class="meta" id="detailDescription"></p><div class="meta" id="detailMeta"></div><h3 class="ranking-title">Рейтинг пака</h3><div class="pack-ranking" id="packRanking"></div><div class="actions"><button id="play">Играть</button><button id="close">Закрыть</button></div></dialog>
<dialog id="createDialog"><h2>Новый пак</h2><form class="form" id="packForm"><input id="name" maxlength="40" placeholder="Название" required><textarea id="description" maxlength="240" placeholder="Описание"></textarea><input id="icon" value="🎵" placeholder="Иконка"><input class="color-input" id="color" type="color" value="#6c5ce7"><input id="manualTrack" placeholder="Название | Исполнитель | URL preview"><button type="button" id="addManual">Добавить ссылку</button><input id="search" placeholder="Найти трек в iTunes" autocomplete="off"><div class="suggestions" id="itunesSuggestions"></div><div class="tracks" id="draftTracks"></div><div class="actions"><button type="submit" id="publish">Опубликовать</button><button type="button" id="cancel">Отмена</button></div></form></dialog>
<script>
const config={apiKey:"AIzaSyAjaN1dabndg-ccVFGcrxdkuHB9wozyrfw",authDomain:"musicallo-3cd30.firebaseapp.com",projectId:"musicallo-3cd30",storageBucket:"musicallo-3cd30.firebasestorage.app",messagingSenderId:"470668714876",appId:"1:470668714876:web:b26686b92ac4f6c6f87af9"}; firebase.initializeApp(config); const db=firebase.firestore(),auth=firebase.auth();
const PAGE_SIZE=9; let pageIndex=0, packs=[], selectedPack=null, draftTracks=[];
const $=id=>document.getElementById(id); const status=text=>{$('packs').innerHTML=`<div class="status">${text}</div>`};
function safeUrl(value){try{const url=new URL(value);return ['http:','https:'].includes(url.protocol)?url.href:''}catch{return ''}}
async function loadPacks(){status('Загрузка паков...');const system=await fetch('system-packs/main.json').then(r=>r.json());const snapshot=await db.collection('packs').get();packs=[{...system,system:true},...snapshot.docs.map(d=>({id:d.id,...d.data()}))];render()}
function render(){const sort=$('sort').value;const ordered=[...packs].sort((a,b)=>sort==='plays'?(b.plays||0)-(a.plays||0):(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));const visible=ordered.slice(pageIndex*PAGE_SIZE,(pageIndex+1)*PAGE_SIZE);$('packs').textContent='';if(!visible.length){status('Паков пока нет');return}visible.forEach(pack=>{const card=document.createElement('article');card.className='pack';card.style.borderTopColor=pack.color||'#6c5ce7';card.innerHTML=`<div class="icon"></div><h2></h2><p></p><div class="meta"></div>`;card.querySelector('.icon').textContent=pack.icon||'🎵';card.querySelector('h2').textContent=pack.name;card.querySelector('p').textContent=pack.description||'Без описания';card.querySelector('.meta').textContent=pack.system?'Системный пак':`${pack.tracks?.length||0} треков ·`;card.onclick=()=>openDetail(pack);$('packs').append(card)});$('page').textContent=pageIndex+1;$('previous').disabled=pageIndex===0;$('next').disabled=(pageIndex+1)*PAGE_SIZE>=ordered.length}
async function openDetail(pack){selectedPack=pack;$('detailName').textContent=`${pack.icon||'🎵'} ${pack.name}`;$('detailDescription').textContent=pack.description||'Без описания';$('detailMeta').textContent=pack.system?'Системный пак':`${pack.tracks?.length||0} треков ·`;$('packRanking').textContent='Загрузка рейтинга...';$('detail').showModal();try{const snapshot=await db.collection('packScores').where('packId','==',pack.id).get();const scores=snapshot.docs.map(doc=>doc.data()).sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,5);$('packRanking').textContent='';if(!scores.length){$('packRanking').textContent='Пока нет результатов';return}scores.forEach((score,index)=>{const item=document.createElement('div');item.className='track';item.textContent=`${index+1}. ${score.nickname||'Игрок'} — ${score.score||0} очк.`;$('packRanking').append(item)})}catch{$('packRanking').textContent='Рейтинг временно недоступен'}}
function renderDraft(){const list=$('draftTracks');list.textContent='';draftTracks.forEach((track,index)=>{const item=document.createElement('div');item.className='track';const title=document.createElement('span');title.textContent=`${index+1}. ${track.fullName}`;const remove=document.createElement('button');remove.type='button';remove.className='remove';remove.textContent='×';remove.onclick=()=>{draftTracks.splice(index,1);renderDraft()};item.append(title,remove);list.append(item)});$('addManual').disabled=draftTracks.length>=20}
function addTrack(track){if(draftTracks.length>=20)return;draftTracks.push(track);renderDraft()}
$('addManual').onclick=()=>{const [name,artist,url]= $('manualTrack').value.split('|').map(v=>v.trim());const audioSrc=safeUrl(url);if(!name||!audioSrc){alert('Укажите: название | исполнитель | URL preview');return}addTrack({id:crypto.randomUUID(),fullName:artist?`${artist} - ${name}`:name,correctAnswers:[name,artist].filter(Boolean),audioSrc});$('manualTrack').value=''}
$('search').oninput=async()=>{const query=$('search').value.trim();const list=$('itunesSuggestions');list.textContent='';if(query.length<2||draftTracks.length>=20)return;const data=await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=5`).then(r=>r.json());data.results.filter(track=>track.previewUrl).forEach(track=>{const button=document.createElement('button');button.type='button';button.className='suggestion';button.textContent=`${track.artistName} — ${track.trackName}`;button.onclick=()=>{addTrack({id:String(track.trackId),fullName:`${track.artistName} - ${track.trackName}`,correctAnswers:[track.trackName,track.artistName],audioSrc:track.previewUrl});list.textContent='';$('search').value=''};list.append(button)})}
$('packForm').onsubmit=async event=>{event.preventDefault();if(!auth.currentUser){alert('Войдите, чтобы создать пак');return}if(!draftTracks.length){alert('Добавьте хотя бы один трек');return}const icon=$('icon').value.trim()||'🎵';if(Array.from(icon).length!==1){alert('Укажите одну иконку');return}const publish=$('publish');if(publish.disabled)return;publish.disabled=true;try{await db.collection('packs').add({name:$('name').value.trim(),description:$('description').value.trim(),icon,color:$('color').value,tracks:draftTracks,creatorId:auth.currentUser.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp(),plays:0});$('createDialog').close();draftTracks=[];event.target.reset();loadPacks()}finally{publish.disabled=false}}
$('play').onclick=()=>{if(selectedPack.system)localStorage.removeItem('musicalloSelectedPack');else localStorage.setItem('musicalloSelectedPack',JSON.stringify(selectedPack));location.href='index.html'};$('close').onclick=()=>$('detail').close();$('create').onclick=()=>$('createDialog').showModal();$('cancel').onclick=()=>$('createDialog').close();$('sort').onchange=()=>{pageIndex=0;render()};$('previous').onclick=()=>{pageIndex--;render()};$('next').onclick=()=>{pageIndex++;render()};loadPacks().catch(()=>status('Не удалось загрузить паки'));
</script>
</body>
</html>
