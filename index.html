<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Musicallo - угадай песню по фрагменту аудио">
  <meta name="theme-color" content="#6366f1">
  <title>Musicallo - Угадай Песню</title>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="src/css/styles.css">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>♪</text></svg>">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="header-content">
      <a href="/" class="logo">Musicallo</a>
      
      <nav id="nav-menu">
        <ul class="nav-links">
          <li><a href="#play">Играть</a></li>
          <li><a href="#leaderboard">Рейтинг</a></li>
          <li><a href="#about">О игре</a></li>
        </ul>
      </nav>

      <div class="user-info">
        <div class="user-avatar" id="profile-btn" title="Профиль">
          <span id="current-nickname">Guest</span>
        </div>
        <button id="logout-btn" class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.9rem;">Выход</button>
      </div>
    </div>
  </header>

  <!-- Auth Container -->
  <div id="auth-container">
    <div class="auth-box">
      <h1 class="auth-title">♪ Musicallo</h1>
      
      <!-- Login Form -->
      <form id="login-form" style="display: none;">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="login-password">Пароль</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>

        <div id="auth-error-msg" class="auth-error-msg"></div>

        <button type="button" id="login-submit" class="btn btn-primary">Войти</button>
      </form>

      <!-- Register Form (shown by default) -->
      <form id="register-form">
        <div class="form-group">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="register-password">Пароль</label>
          <input type="password" id="register-password" placeholder="Минимум 6 символов" required>
        </div>

        <div class="form-group">
          <label for="register-confirm-password">Подтвердите пароль</label>
          <input type="password" id="register-confirm-password" placeholder="••••••••" required>
        </div>

        <div id="auth-error-msg" class="auth-error-msg"></div>

        <button type="button" id="register-submit" class="btn btn-primary">Зарегистрироваться</button>
      </form>

      <!-- Toggle Auth Mode -->
      <div class="auth-footer">
        <button type="button" id="toggle-auth-btn">Уже есть аккаунт? Войти</button>
      </div>
    </div>
  </div>

  <!-- Game Container -->
  <div id="game-container">
    <div class="container">
      <div class="game-wrapper">
        <!-- Main Game Screen -->
        <main id="game-screen" class="game-screen">
          <div class="game-header">
            <div class="game-title">Угадай песню</div>
            <div class="game-attempts">
              <span>Попытки:</span>
              <div class="attempt-indicator">
                <span class="attempt-dot active" id="attempt-0"></span>
                <span class="attempt-dot" id="attempt-1"></span>
                <span class="attempt-dot" id="attempt-2"></span>
              </div>
            </div>
          </div>

          <!-- Audio Player -->
          <div class="audio-player">
            <div class="duration-display">
              <span id="current-duration">0</span>ms / <span id="max-duration">0</span>ms
              <small>Слушай песню и угадай её название</small>
            </div>
            <button id="play-btn" class="play-btn" title="Воспроизвести">▶</button>
          </div>

          <!-- Guess Section -->
          <div class="guess-section">
            <label class="guess-label">Введите название песни или исполнителя:</label>
            <div class="guess-input-wrapper">
              <input 
                type="text" 
                id="guess-input" 
                placeholder="Например: 'Bohemian Rhapsody' или 'Queen'"
                autocomplete="off"
              >
              <div id="suggestions"></div>
            </div>
            <button type="button" id="submit-guess" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Проверить</button>
          </div>

          <!-- Action Buttons -->
          <div class="button-group">
            <button type="button" id="skip-btn" class="btn btn-skip">Пропустить (+услышать)</button>
            <button type="button" id="give-up-btn" class="btn btn-give-up">Сдаться</button>
          </div>

          <!-- Result Message -->
          <div id="result-message" class="result-message"></div>
        </main>

        <!-- Stats Sidebar -->
        <aside class="stats-sidebar">
          <div class="stats-title">Ваша статистика</div>

          <div class="stat-item">
            <span class="stat-label">Уровень</span>
            <span class="stat-value" id="level">1</span>
          </div>

          <div class="stat-item">
            <span class="stat-label">Очки</span>
            <span class="stat-value" id="score">0</span>
          </div>

          <div class="stat-item">
            <span class="stat-label">Текущая попытка</span>
            <span class="stat-value" id="attempt">0</span>
          </div>

          <div class="stat-item">
            <span class="stat-label">Очки за этот трек</span>
            <span class="stat-value" id="points">0</span>
          </div>

          <div class="progress-section">
            <span class="stat-label">Прогресс до следующего уровня</span>
            <div class="progress-bar">
              <div class="progress-fill" id="progress-bar" style="width: 0%"></div>
            </div>
            <small style="color: var(--text-muted);">
              Ещё <span id="score-to-next">0</span> очков
            </small>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <!-- Profile Modal -->
  <div id="profile-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Профиль</h2>
        <button type="button" id="close-profile" class="modal-close">&times;</button>
      </div>

      <div class="profile-avatar">
        <img id="current-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='30' r='20' fill='%23fff'/%3E%3Cpath d='M 10 100 Q 10 70 50 70 Q 90 70 90 100' fill='%23fff'/%3E%3C/svg%3E" alt="Аватар" style="width: 100%; height: 100%; border-radius: 50%;">
      </div>

      <div style="text-align: center; margin-bottom: 1.5rem;">
        <p style="color: var(--text-secondary); margin-bottom: 0.5rem;">Текущий пользователь</p>
        <p style="font-size: 1.2rem; font-weight: bold;" id="current-nickname-display">Guest</p>
      </div>

      <form id="profile-form">
        <div class="form-group">
          <label for="nickname-input">Ник</label>
          <input type="text" id="nickname-input" placeholder="Ваш никнейм" maxlength="30" required>
        </div>

        <div class="form-group">
          <label for="avatar-input">URL аватара (опционально)</label>
          <input type="url" id="avatar-input" placeholder="https://example.com/avatar.jpg">
        </div>

        <div id="profile-error" class="auth-error-msg"></div>

        <button type="button" id="save-profile" class="btn btn-primary">Сохранить</button>
      </form>
    </div>
  </div>

  <!-- Loading Spinner -->
  <div id="loading-spinner">
    <div class="spinner"></div>
  </div>

  <!-- Error Container -->
  <div id="error-container">
    <span id="error-message"></span>
  </div>

  <!-- Scripts -->
  <script type="module" src="src/js/main.js"></script>
</body>
</html>
